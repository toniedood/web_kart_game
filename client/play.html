<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Peaky Console</title>
    <link rel="stylesheet" href="/shared/peaky.css" />
    <style>
      :root {
        --accent: #888;
        --body: #cdcbc4; --body-hi: #e6e4de; --body-lo: #a9a69e; --body-dark: #8c8981;
        --dpad: #2c2c34; --dpad-hi: #4a4a56; --dpad-lo: #17171c;
        --ab: #a8205a; --ab-hi: #d8467f; --ab-lo: #6e1038; --ab-dark: #5a0e30;
        --bezel: #5b5f70; --lcd: #9bbc0f; --lcd-mid: #8bac0f; --lcd-dark: #0f380f;
        --dp: 32vmin; --abs: 21vmin;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
        background: var(--body); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      }
      .hidden { display: none !important; }
      .screen { display: none; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      .screen.active { display: flex; }

      /* the console body, shared by both screens */
      .shell { background: linear-gradient(180deg, var(--body-hi), var(--body) 30%, var(--body-lo)); box-shadow: inset 0 0.8vmin 0 var(--body-hi), inset 0 -1.2vmin 0 var(--body-dark); }
      .lcd { background: var(--lcd); color: var(--lcd-dark); box-shadow: inset 0.8vmin 0.8vmin 0 var(--lcd-mid), inset -0.4vmin -0.4vmin 0 #a8c820; border: 0.6vmin solid #2a2d38; }
      .lcd::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(15, 56, 15, 0.07) 0 0.3vmin, transparent 0.3vmin 0.7vmin); pointer-events: none; }
      .bezel { position: relative; background: var(--bezel); border-radius: 2vmin 2vmin 8vmin 2vmin; padding: 2.4vmin 3vmin 3vmin; box-shadow: inset 0 0 0 0.5vmin #3c3f4d; }
      .bezel .cap { font-size: 1.5vmin; color: #c9c6e0; letter-spacing: 0.15vmin; display: flex; justify-content: space-between; margin-bottom: 1.2vmin; }
      .bezel .cap i { font-style: normal; display: inline-block; width: 1.6vmin; height: 1.6vmin; border-radius: 50%; background: #e03030; box-shadow: 0 0 1.6vmin #f33; margin-right: 1vmin; vertical-align: -0.3vmin; }
      .brand { font-style: italic; font-weight: bold; color: #2d3a8c; font-size: 2.6vmin; letter-spacing: 0.2vmin; }
      .brand em { color: #b01c5a; font-style: italic; }
      .brandRow { display: flex; align-items: center; justify-content: center; gap: 3vmin; }
      .pill { border: 0; border-radius: 3vmin; background: #6f6d78; color: #f2f0ff; font-size: 1.6vmin; padding: 1.2vmin 2vmin; box-shadow: inset 0.4vmin 0.4vmin 0 #9a98a4, inset -0.4vmin -0.4vmin 0 #3e3d46; }
      .pill:active { filter: brightness(0.8); }

      /* join screen: the form is shown on the console's LCD */
      #join { flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; text-align: center; padding: 4vmin; }
      #join .bezel { width: min(86vw, 120vmin); }
      #join .lcd { position: relative; padding: 3vmin; display: flex; flex-direction: column; align-items: center; gap: 2.2vmin; }
      #join .logo { font-size: 4.6vmin; text-shadow: none; color: var(--lcd-dark); }
      #join .logo span { color: var(--lcd-dark) !important; }
      #join .sub { margin: 0; font-size: 2vmin; }
      #join input { font-size: max(16px, 3.2vmin); padding: 1.6vmin; width: 100%; text-align: center; border: 0.5vmin solid var(--lcd-dark); background: var(--lcd-mid); color: var(--lcd-dark); border-radius: 0; outline: none; }
      #join input::placeholder { color: #306230; }
      #join .btn { font-size: 3vmin; padding: 1.8vmin 5vmin; }
      #error { color: #fff; background: #a01818; padding: 1vmin 2vmin; font-size: 1.8vmin; position: relative; }
      #error:empty { display: none; }

      /* controller screen. LANDSCAPE (default here): D-pad | screen | A B */
      #pad { position: relative; display: none; padding: 3vmin 4vmin; gap: 2vmin 2vmin;
        grid-template-columns: 34vmin 1fr 42vmin; grid-template-rows: 1fr;
        grid-template-areas: "dpad middle ab"; }
      #pad.active { display: grid; }
      #dpadWrap { grid-area: dpad; position: relative; touch-action: none; -webkit-user-select: none; user-select: none; }
      #middle { grid-area: middle; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2vmin; }
      #ab { grid-area: ab; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; touch-action: none; }
      .cluster { position: relative; width: calc(var(--abs) * 1.6); height: calc(var(--abs) * 2 + 20vmin); }

      /* floating joystick: the D-pad picture appears under the thumb and the hub is the stick */
      #dpad { position: absolute; left: 50%; top: 50%; width: var(--dp); height: var(--dp); pointer-events: none;
        transform: translate(calc(-50% + var(--jx, 0px)), calc(-50% + var(--jy, 0px))); }
      #dpad.glide { transition: transform 0.12s ease-out; }
      #dpad.live { filter: brightness(1.12); }
      #dpad .hub { transform: translate(var(--kx, 0px), var(--ky, 0px)); }
      #dpad::before, #dpad::after { content: ""; position: absolute; background: var(--dpad); box-shadow: inset 0.6vmin 0.6vmin 0 var(--dpad-hi), inset -0.6vmin -0.6vmin 0 var(--dpad-lo), 0 0.5vmin 0 rgba(0, 0, 0, 0.35); }
      #dpad::before { left: 0; right: 0; top: 33%; bottom: 33%; border-radius: 1.4vmin; }
      #dpad::after { top: 0; bottom: 0; left: 33%; right: 33%; border-radius: 1.4vmin; }
      #dpad .hub { position: absolute; left: 34%; right: 34%; top: 34%; bottom: 34%; background: radial-gradient(circle at 35% 30%, var(--dpad-hi), var(--dpad) 60%, var(--dpad-lo)); border-radius: 50%; z-index: 4; box-shadow: 0 0.6vmin 0 rgba(0, 0, 0, 0.45), inset 0 0.3vmin 0 rgba(255, 255, 255, 0.15); }
      #dpad.live .hub { background: radial-gradient(circle at 35% 30%, #fff3a0, #ffd200 60%, #b88a00); }
      #dpad button { position: absolute; z-index: 3; background: transparent; border: 0; padding: 0; pointer-events: none; }
      #dpad button[data-btn="left"], #dpad button[data-btn="right"] { top: 30%; bottom: 30%; width: 36%; }
      #dpad button[data-btn="up"], #dpad button[data-btn="down"] { left: 30%; right: 30%; height: 36%; }
      #dpad button[data-btn="left"] { left: 0; }
      #dpad button[data-btn="right"] { right: 0; }
      #dpad button[data-btn="up"] { top: 0; }
      #dpad button[data-btn="down"] { bottom: 0; }
      #dpad button::before { content: ""; position: absolute; width: 0; height: 0; border: 2.2vmin solid transparent; }
      #dpad button[data-btn="left"]::before { top: 50%; margin-top: -2.2vmin; left: 1.4vmin; border-right: 3.2vmin solid #7a7a86; border-left: 0; }
      #dpad button[data-btn="right"]::before { top: 50%; margin-top: -2.2vmin; right: 1.4vmin; border-left: 3.2vmin solid #7a7a86; border-right: 0; }
      #dpad button[data-btn="up"]::before { left: 50%; margin-left: -2.2vmin; top: 1.4vmin; border-bottom: 3.2vmin solid #7a7a86; border-top: 0; }
      #dpad button[data-btn="down"]::before { left: 50%; margin-left: -2.2vmin; bottom: 1.4vmin; border-top: 3.2vmin solid #7a7a86; border-bottom: 0; }
      #dpad button.down[data-btn="left"]::before { border-right-color: #ffd200; }
      #dpad button.down[data-btn="right"]::before { border-left-color: #ffd200; }
      #dpad button.down[data-btn="up"]::before { border-bottom-color: #ffd200; }
      #dpad button.down[data-btn="down"]::before { border-top-color: #ffd200; }

      #pad .bezel { padding-bottom: 2.4vmin; }
      #lcd { position: relative; padding: 1.8vmin 2vmin; min-height: 26vmin; display: flex; flex-direction: column; justify-content: space-between; gap: 1vmin; font-size: 2.3vmin; line-height: 1.5; }
      #lcdTop { display: flex; justify-content: space-between; align-items: center; gap: 1vmin; border-bottom: 0.4vmin solid var(--lcd-dark); padding-bottom: 0.8vmin; }
      #who { max-width: 55%; overflow: hidden; white-space: nowrap; }
      #who::before { content: ""; display: inline-block; width: 2vmin; height: 2vmin; background: var(--accent); border: 0.35vmin solid var(--lcd-dark); margin-right: 1vmin; vertical-align: -0.2vmin; }
      #phase { font-size: 1.8vmin; }
      .stats { display: flex; justify-content: space-between; font-size: 3.4vmin; }
      #itemRow { font-size: 2.2vmin; }
      #lcd b { font-weight: normal; }
      #itemBtn { width: 32vmin; height: 10vmin; border: 0; border-radius: 5vmin; background: #6f6d78; transform: rotate(-12deg); box-shadow: inset 0.6vmin 0.6vmin 0 #9a98a4, inset -0.6vmin -0.6vmin 0 #3e3d46, 0 0.8vmin 0 rgba(0, 0, 0, 0.3); color: #f2f0ff; font-size: 3vmin; touch-action: none; position: relative; }
      #itemBtn::before { content: ""; position: absolute; inset: -2vmin; }
      #itemBtn.down { transform: rotate(-12deg) translateY(0.8vmin); filter: brightness(0.8); }

      .abtn { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 1vmin; }
      .abtn.a { right: 0; top: 0; }
      .abtn.b { left: 0; bottom: 0; }
      .abtn button { position: relative; width: var(--abs); height: var(--abs); border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, var(--ab-hi), var(--ab) 55%, var(--ab-lo)); box-shadow: 0 0.9vmin 0 var(--ab-dark), 0 1.4vmin 1.2vmin rgba(0, 0, 0, 0.35); color: transparent; touch-action: none; }
      .abtn button::before { content: ""; position: absolute; inset: -2vmin; } /* bigger touch area than the picture */
      .abtn button.down { transform: translateY(0.8vmin); box-shadow: 0 0.2vmin 0 var(--ab-dark); filter: brightness(0.85); }
      .abtn .tag { font-size: 3vmin; color: #2d3a8c; font-style: italic; font-weight: bold; text-align: center; }
      .abtn .tag small { display: block; font-size: 1.3vmin; font-style: normal; color: #55536a; margin-top: 0.4vmin; }

      @keyframes lcdhit { 0% { filter: invert(1); transform: translateX(-0.8vmin); } 35% { filter: invert(1); transform: translateX(0.8vmin); } 70% { filter: none; transform: translateX(-0.4vmin); } 100% { filter: none; transform: none; } }
      .lcd.hit { animation: lcdhit 0.28s linear; }
      @keyframes lcdpop { 0% { transform: scale(1.18); } 100% { transform: none; } }
      .lcd b.pop { display: inline-block; animation: lcdpop 0.25s ease-out; }

      #speaker { position: absolute; right: 3vmin; bottom: 2.4vmin; width: 14vmin; height: 8vmin; transform: rotate(-30deg); background: repeating-linear-gradient(90deg, var(--body-dark) 0 0.9vmin, transparent 0.9vmin 2vmin); border-radius: 1vmin; opacity: 0.8; pointer-events: none; }

      /* PORTRAIT (the main way to hold it): screen on top, D-pad and A B below, like the original Game Boy */
      @media (orientation: portrait) {
        :root { --dp: 42vmin; --abs: 21vmin; }
        #pad { padding: 5vmin 6vmin 7vmin; gap: 3vmin; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto;
          grid-template-areas: "middle middle" "dpad ab"; }
        #lcd { min-height: 46vmin; padding: 3vmin; font-size: 3.4vmin; }
        .stats { font-size: 6vmin; }
        #itemRow { font-size: 3.4vmin; }
        #phase { font-size: 2.6vmin; }
        .bezel .cap { font-size: 1.9vmin; }
        .brand { font-size: 3.6vmin; }
        .pill { font-size: 2.2vmin; padding: 1.4vmin 2.4vmin; }
        #ab { align-self: center; }
        #itemBtn { width: 36vmin; height: 11vmin; font-size: 3.2vmin; }
        #speaker { right: 6vmin; bottom: 5vmin; width: 18vmin; height: 10vmin; }
      }

      /* settings sheet */
      #settings, #character { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; padding: 3vmin; }
      #sheet, #charSheet { position: relative; width: min(94vw, 110vmin); max-height: 94vh; overflow-y: auto; touch-action: pan-y; padding: 3vmin; background: var(--lcd); color: var(--lcd-dark); border: 0.8vmin solid #2a2d38; box-shadow: inset 0.8vmin 0.8vmin 0 var(--lcd-mid); }
      #sheet h2, #charSheet h2 { margin: 0 0 2vmin; font-size: 3vmin; font-weight: normal; text-align: center; }
      #sheet h3, #charSheet h3 { margin: 2.4vmin 0 1.2vmin; font-size: 2vmin; font-weight: normal; }
      #charPreview { display: block; margin: 0 auto 1vmin; width: 46vmin; height: 38.4vmin; image-rendering: pixelated; border: 0.6vmin solid var(--lcd-dark); background: #0a0418; }
      .opts { display: flex; flex-wrap: wrap; gap: 1.4vmin; }
      .opt { border: 0.5vmin solid var(--lcd-dark); background: var(--lcd-mid); color: var(--lcd-dark); font-size: 2vmin; padding: 1.2vmin 1.6vmin; border-radius: 0; }
      .opt.on { background: var(--lcd-dark); color: var(--lcd); }
      .swatch.auto { background: var(--lcd-mid); font-size: 1.6vmin; color: var(--lcd-dark); }
      .swatches { display: flex; flex-wrap: wrap; gap: 1.8vmin; }
      .swatch { width: 8vmin; height: 8vmin; border: 0.6vmin solid var(--lcd-dark); border-radius: 0; padding: 0; box-shadow: inset 0.6vmin 0.6vmin 0 rgba(255, 255, 255, 0.35), inset -0.6vmin -0.6vmin 0 rgba(0, 0, 0, 0.3); }
      .swatch.on { outline: 0.7vmin solid var(--lcd-dark); outline-offset: 0.5vmin; }
      #sheetBtns, #charBtns { display: flex; gap: 2vmin; justify-content: center; margin-top: 3vmin; }
      #sheetBtns .btn, #charBtns .btn { font-size: 2.4vmin; padding: 1.6vmin 3vmin; }
      @media (orientation: portrait) {
        #sheet, #charSheet { padding: 5vmin; }
        #charPreview { width: 70vmin; height: 58.3vmin; }
        .opt { font-size: 3vmin; padding: 1.6vmin 2.2vmin; }
        .swatch.auto { font-size: 2.2vmin; }
        #sheet h2, #charSheet h2 { font-size: 4.4vmin; }
        #sheet h3, #charSheet h3 { font-size: 3vmin; }
        .swatch { width: 12vmin; height: 12vmin; }
        #sheetBtns .btn, #charBtns .btn { font-size: 3.4vmin; }
      }
    </style>
  </head>
  <body>
    <div id="join" class="screen shell active">
      <div class="bezel">
        <div class="cap"><span><i></i>BATTERY</span><span>DOT MATRIX WITH STEREO SOUND</span></div>
        <div class="lcd">
          <h1 class="logo">Peaky Console</h1>
          <p class="sub">KART RACE</p>
          <input id="name" placeholder="YOUR NAME" maxlength="12" autocomplete="off" />
          <button id="joinBtn" class="btn green">Join</button>
          <div id="error"></div>
        </div>
      </div>
      <div class="brand">PEAKY <em>CONSOLE</em></div>
      <div class="brandRow"><button class="pill characterBtn">CHARACTER</button><button class="pill settingsBtn">SETTINGS</button></div>
    </div>

    <div id="pad" class="screen shell">
      <div id="dpadWrap">
        <div id="dpad">
          <button data-btn="up"></button>
          <button data-btn="down"></button>
          <button data-btn="left"></button>
          <button data-btn="right"></button>
          <div class="hub"></div>
        </div>
      </div>

      <div id="middle">
        <div class="bezel">
          <div class="cap"><span><i></i>BATTERY</span><span>DOT MATRIX</span></div>
          <div id="lcd" class="lcd">
            <div id="lcdTop"><span id="who"></span><span id="phase"></span></div>
            <div class="stats"><span><span id="lblA">LAP</span> <b id="lap">-</b></span><span><span id="lblB">POS</span> <b id="pos">-</b></span></div>
            <div id="itemRow"><span id="lblC">ITEM:</span> <b id="item">-</b></div>
          </div>
        </div>
        <div class="brand">PEAKY <em>CONSOLE</em></div>
        <div class="brandRow"><button class="pill characterBtn">CHARACTER</button><button class="pill settingsBtn">SETTINGS</button></div>
      </div>

      <div id="ab">
        <div class="cluster">
          <div class="abtn a"><button data-btn="gas">GAS</button><span class="tag">A<small id="capGas">GAS</small></span></div>
          <div class="abtn b"><button data-btn="brake">BRAKE</button><span class="tag">B<small id="capBrake">BRAKE</small></span></div>
        </div>
        <button id="itemBtn" data-btn="item">ITEM</button>
      </div>
      <div id="speaker"></div>
    </div>

    <div id="character" class="hidden">
      <div id="charSheet">
        <h2>CHARACTER</h2>
        <canvas id="charPreview" width="240" height="200"></canvas>
        <h3>HAIR STYLE</h3><div class="opts" id="opt-hairStyle"></div>
        <h3>HAIR COLOUR</h3><div class="swatches" id="sw-hairColor"></div>
        <h3>SKIN</h3><div class="swatches" id="sw-skin"></div>
        <h3>OUTFIT AND KART COLOUR</h3><div class="swatches" id="sw-outfit"></div>
        <h3>EXTRA</h3><div class="opts" id="opt-accessory"></div>
        <div id="charBtns"><button id="randomLook" class="btn grey">Random</button><button id="closeCharacter" class="btn green">Done</button></div>
      </div>
    </div>

    <div id="settings" class="hidden">
      <div id="sheet">
        <h2>SETTINGS</h2>
        <h3>CONSOLE BODY</h3><div class="swatches" id="sw-body"></div>
        <h3>D-PAD</h3><div class="swatches" id="sw-dpad"></div>
        <h3>A / B BUTTONS</h3><div class="swatches" id="sw-ab"></div>
        <div id="sheetBtns"><button id="resetStyle" class="btn grey">Reset</button><button id="closeSettings" class="btn green">Done</button></div>
      </div>
    </div>

    <script type="module" src="/controller/main.js"></script>
  </body>
</html>
