<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peaky Console</title>
    <link rel="stylesheet" href="/shared/peaky.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      .cell { position: absolute; box-sizing: border-box; border: 0.4vmin solid #000; text-shadow: 0.35vmin 0.35vmin 0 #000; }
      .cell .name { position: absolute; top: 0.8vmin; left: 0.8vmin; padding: 0.7vmin 1.2vmin; font-size: 1.6vmin; background: #000b; border-left: 1vmin solid; }
      .cell .lap { position: absolute; top: 1.2vmin; right: 1vmin; font-size: 2vmin; }
      .cell .pos { position: absolute; bottom: 1vmin; left: 1.2vmin; font-size: 3.2vmin; color: var(--coin); }
      .cell .speed { position: absolute; bottom: 1.2vmin; right: 1.2vmin; font-size: 1.8vmin; }
      .cell .done { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 4vmin; color: var(--coin); }
      .cell .item { position: absolute; bottom: 1.4vmin; left: 50%; transform: translateX(-50%); font-size: 1.8vmin; white-space: nowrap; color: #58d854; }
      #banner { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20vmin; color: var(--coin); text-shadow: 1.2vmin 1.2vmin 0 #000; pointer-events: none; }

      .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 2.4vmin 3.6vmin; text-align: center; max-height: 92vh; }
      #lobby { width: 92vmin; max-width: 96vw; }
      #lobby .logo { font-size: 5.6vmin; }
      #lobby .tagline { margin: 1.4vmin 0 2vmin; font-size: 1.6vmin; color: var(--grey); }
      #lobbyGrid { display: grid; grid-template-columns: auto 1fr; gap: 3.5vmin; align-items: start; text-align: left; }
      #joinCol { text-align: center; }
      #joinCol h2 { margin: 0 0 1.2vmin; font-size: 1.8vmin; color: var(--coin); font-weight: normal; }
      #qr { width: 24vmin !important; height: 24vmin !important; image-rendering: pixelated; border: 0.8vmin solid var(--white); display: block; }
      #code { margin-top: 1.4vmin; font-size: 4.6vmin; letter-spacing: 0.4vmin; color: var(--white); text-shadow: 0.6vmin 0.6vmin 0 var(--brick); }
      #url { margin-top: 1vmin; color: var(--grey); font-size: 1vmin; word-break: break-all; max-width: 24vmin; }
      #players, #standings { list-style: none; padding: 0; margin: 0 0 1.6vmin; font-size: 2vmin; min-height: 3vmin; }
      #standings { font-size: 2.6vmin; margin: 1.6vmin 0; text-align: left; }
      #players li, #standings li { margin: 1vmin 0; }
      #players li.gone { opacity: 0.4; }
      #players:empty::before { content: "Waiting for players..."; color: var(--grey); }
      #players canvas.head { width: 8vmin; height: 8vmin; vertical-align: middle; margin-right: 1vmin; image-rendering: pixelated; }
      .dot { display: inline-block; width: 2vmin; height: 2vmin; margin-right: 1.2vmin; border: 0.3vmin solid #000; outline: 0.3vmin solid var(--white); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 1vmin; font-size: 1.6vmin; margin: 1.2vmin 0; }
      .row b { flex: 1; text-align: center; font-weight: normal; color: var(--coin); }
      .btn.small { padding: 0.9vmin 1.4vmin; font-size: 1.6vmin; }
      #startBtn, #rematchBtn { font-size: 2.4vmin; width: 100%; margin-top: 1vmin; }
      #lobbyBtn { font-size: 1.6vmin; width: 100%; margin-top: 2vmin; }
      #fight, #shooter { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; background: #000; }
      .hint { color: var(--grey); font-size: 1vmin; line-height: 1.6; margin: 1.6vmin 0 0; }
      #results { min-width: 56vmin; }
      #results h1 { margin: 0; font-size: 4vmin; }
      #perf { white-space: pre; line-height: 1.6; position: fixed; left: 1vmin; bottom: 1vmin; font-size: 1.2vmin; color: #58d854; text-shadow: 0.2vmin 0.2vmin 0 #000; pointer-events: none; }
      #menuBtn { position: fixed; left: 50%; bottom: 1.5vmin; transform: translateX(-50%); z-index: 5; font-size: 1.5vmin; padding: 1vmin 2vmin; }
      #sound { position: fixed; right: 1vmin; bottom: 13.5vmin; font-size: 1vmin; color: var(--white); opacity: 0.6; pointer-events: none; }
      #ground { position: fixed; left: 0; right: 0; bottom: 0; height: 12vmin; border-top: 0.8vmin solid #000; }
      .minimap { position: absolute; width: 12vmin; height: 12vmin; image-rendering: pixelated; }
      .j-speed .speed { right: 8vmin; }
      .j-pos .pos { left: 8vmin; }
      .j-lap .lap { right: 8vmin; }
      .j-name .name { left: 8vmin; }
      .minimap.center { left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0.95; }
      .minimap.bottom { left: 50%; bottom: 1vmin; transform: translateX(-50%); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="fight" class="hidden"></canvas>
    <canvas id="shooter" class="hidden"></canvas>
    <div id="hud"></div>
    <div id="banner"></div>
    <button id="menuBtn" class="btn grey hidden">BACK TO LOBBY (ESC)</button>
    <div id="perf" class="hidden"></div>
    <div id="sound">SOUND ON (M)</div>
    <div id="ground" class="bricks"></div>

    <div id="lobby" class="panel box">
      <h1 class="logo" id="logo">Peaky Console</h1>
      <p class="tagline" id="tagline">KART RACE</p>
      <div id="lobbyGrid">
        <div id="joinCol">
          <h2>SCAN TO JOIN</h2>
          <canvas id="qr"></canvas>
          <div id="code">----</div>
          <div id="url"></div>
        </div>
        <div>
          <ul id="players"></ul>
          <div class="row">GAME <button id="gamePrev" class="btn small">&lt;</button><b id="gameName"></b><button id="gameNext" class="btn small">&gt;</button></div>
          <div class="row" id="rowTrack">TRACK <button id="trackPrev" class="btn small">&lt;</button><b id="trackName"></b><button id="trackNext" class="btn small">&gt;</button></div>
          <div class="row"><span id="aiLabel">AI KARTS</span> <button id="aiLess" class="btn small">-</button><b id="aiCount"></b><button id="aiMore" class="btn small">+</button></div>
          <button id="startBtn" class="btn green" disabled>Start race</button>
        </div>
      </div>
      <p class="hint">ENTER = START / G = GAME / LEFT RIGHT = TRACK / UP DOWN = AI<br />AI players only fill free places (max 4)</p>
    </div>

    <div id="results" class="panel box hidden">
      <h1 class="logo">Results</h1>
      <ol id="standings"></ol>
      <button id="rematchBtn" class="btn green">Rematch</button>
      <button id="lobbyBtn" class="btn grey">Back to lobby</button>
      <p class="hint">ENTER / SPACE = REMATCH / L = LOBBY</p>
    </div>

    <script type="module" src="/host/main.js"></script>
  </body>
</html>
