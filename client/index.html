<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kart Game – Host</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      .cell { position: absolute; box-sizing: border-box; border: 1px solid #000; text-shadow: 0 2px 4px #000; font-weight: bold; }
      .cell .name { position: absolute; top: 0.6vmin; left: 0.8vmin; padding: 0.3vmin 1.2vmin; font-size: 2.4vmin; background: #0008; border-left: 1vmin solid; border-radius: 0.6vmin; }
      .cell .lap { position: absolute; top: 0.6vmin; right: 1vmin; font-size: 3vmin; }
      .cell .pos { position: absolute; bottom: 1vmin; left: 1.2vmin; font-size: 5vmin; }
      .cell .speed { position: absolute; bottom: 1vmin; right: 1.2vmin; font-size: 3vmin; }
      .cell .done { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 6vmin; color: #ffd54a; }
      #banner { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22vmin; font-weight: bold; text-shadow: 0 0.5vmin 2vmin #000; pointer-events: none; }
      .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000b; padding: 2vmin 4vmin; border-radius: 2vmin; text-align: center; min-width: 40vmin; }
      .panel h1 { margin: 0 0 1vmin; font-size: 4vmin; }
      #code { font-size: 12vmin; letter-spacing: 1.5vmin; line-height: 1.1; }
      #url { color: #aaa; font-size: 2vmin; margin-bottom: 1vmin; }
      #players, #standings { list-style: none; padding: 0; margin: 1vmin 0; font-size: 3.4vmin; }
      #players li, #standings li { margin: 0.6vmin 0; }
      #players li.gone { opacity: 0.4; }
      .dot { display: inline-block; width: 2.2vmin; height: 2.2vmin; border-radius: 50%; margin-right: 1vmin; }
      button { font-size: 3vmin; padding: 1.2vmin 3vmin; margin: 0.5vmin; border: none; border-radius: 1vmin; background: #3a3; color: #fff; cursor: pointer; }
      button:disabled { background: #555; cursor: default; }
      button.secondary { background: #555; }
      .row { font-size: 2.6vmin; margin: 0.6vmin 0; }
      .row b { display: inline-block; min-width: 18vmin; }
      button.small { font-size: 2.4vmin; padding: 0.4vmin 1.6vmin; background: #555; }
      .cell .item { position: absolute; bottom: 1vmin; left: 50%; transform: translateX(-50%); font-size: 2.6vmin; white-space: nowrap; color: #ffe27a; }
      .hint { color: #aaa; font-size: 2vmin; margin: 1vmin 0 0; }
      .minimap { position: absolute; width: 12vmin; height: 12vmin; }
      .j-speed .speed { right: 8vmin; }
      .j-pos .pos { left: 8vmin; }
      .j-lap .lap { right: 8vmin; }
      .j-name .name { left: 8vmin; }
      .minimap.center { left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0.9; }
      .minimap.bottom { left: 50%; bottom: 1vmin; transform: translateX(-50%); }
      #sound { position: fixed; left: 50%; top: 0.3vmin; transform: translateX(-50%); font-size: 1.6vmin; color: #fff9; pointer-events: none; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="banner"></div>
    <div id="sound">Sound on (M)</div>

    <div id="lobby" class="panel">
      <h1>Scan to join</h1>
      <canvas id="qr"></canvas>
      <div id="code">----</div>
      <div id="url"></div>
      <ul id="players"></ul>
      <div class="row">Track <button id="trackPrev" class="small">◀</button><b id="trackName"></b><button id="trackNext" class="small">▶</button></div>
      <div class="row">AI karts <button id="aiLess" class="small">−</button><b id="aiCount"></b><button id="aiMore" class="small">+</button></div>
      <button id="startBtn" disabled>Start race</button>
      <p class="hint">Keys: Enter = start, ◀ ▶ = track, ▲ ▼ = AI karts. AI karts only fill free places (max 4 karts).</p>
    </div>

    <div id="results" class="panel hidden">
      <h1>Results</h1>
      <ol id="standings"></ol>
      <button id="rematchBtn">Rematch</button>
      <button id="lobbyBtn" class="secondary">Back to lobby</button>
      <p class="hint">Enter / Space = rematch, L = lobby</p>
    </div>

    <script type="module" src="/host/main.js"></script>
  </body>
</html>
